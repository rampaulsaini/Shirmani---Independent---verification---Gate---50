name: SHIRMANI Independent Verification Gate 50
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: shirmani-independent-verification-gate-50
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verifier/test_verify.py
      - run: python verifier/verify.py
      - run: python verifier/validate_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: shirmani-verification-gate-50-report
          path: |
            reports/verification-report.json
            reports/verification-summary.md
            reports/verification-dashboard.html
          if-no-files-found: error
