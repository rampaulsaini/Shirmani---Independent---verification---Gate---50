name: SHIRMANI Independent Verification Gate 50

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shirmani-independent-verification-gate-50
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run verifier regression tests
        run: python verifier/test_verify.py
      - name: Run deterministic verifier
        run: python verifier/verify.py
      - name: Validate verification report
        run: python verifier/validate_report.py
      - name: Persist verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/verification-report.json reports/verification-summary.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: persist verification report [skip ci]"
            git push
          fi
      - name: Build deployable site
        run: |
          rm -rf _site
          mkdir -p _site/reports
          cp docs/index.html _site/index.html
          cp reports/verification-report.json _site/reports/verification-report.json
          cp reports/verification-summary.md _site/reports/verification-summary.md
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-verification-gate-50-report
          path: |
            reports/verification-report.json
            reports/verification-summary.md
          if-no-files-found: error

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
