name: SHIRMANI Independent Verification Gate 50
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: shirmani-independent-verification-gate-50
  cancel-in-progress: false
jobs:
  verify:
    name: Fail-Closed Independent Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run verifier regression tests
        run: python verifier/test_verify.py
      - name: Run deterministic verification gate
        run: python verifier/verify.py
      - name: Publish verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-independent-verification-report
          path: reports/
          if-no-files-found: error
          retention-days: 30
